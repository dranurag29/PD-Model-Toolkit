  validation:
    cmd: python pipeline/stages/s10_validation.py
    deps:
      - pipeline/stages/s10_validation.py
      - pipeline/common/metrics.py
      - pipeline/common/stats.py
      - pipeline/common/io.py
      - artifacts/09_model_selection/development.parquet
      - artifacts/09_model_selection/validation.parquet
      - artifacts/09_model_selection/metrics.json
    params:
      - global
      - validation
    outs:
      - artifacts/10_validation/development.parquet
      - artifacts/10_validation/validation.parquet
    metrics:
      - artifacts/10_validation/metrics.json:
          cache: false

  documentation:
    cmd: python pipeline/stages/s11_documentation.py
    deps:
      - pipeline/stages/s11_documentation.py
      - pipeline/common/stats.py
      - pipeline/common/io.py
      - artifacts/10_validation/development.parquet
      - artifacts/10_validation/validation.parquet
      - artifacts/10_validation/metrics.json
      - decisions/documentation_rules.yaml
    params:
      - global
      - documentation
    outs:
      - artifacts/11_documentation/development.parquet
      - artifacts/11_documentation/validation.parquet
    metrics:
      - artifacts/11_documentation/metrics.json:
          cache: false
